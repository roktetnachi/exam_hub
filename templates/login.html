<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Sign in — ExamHub</title>
<style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:#f4f6f8;font-family:Arial,sans-serif;color:#1f2328}.card{width:min(360px,calc(100% - 40px));background:#fff;border:1px solid #d7dbe0;border-radius:10px;padding:28px;box-shadow:0 6px 24px #1a5fb41a}h1{color:#124a91;font-size:23px;margin:0 0 6px}p{color:#5b6470;font-size:14px;margin:0 0 22px}.field{margin-bottom:16px}label{display:block;font-size:13px;font-weight:bold;margin-bottom:6px}input{width:100%;box-sizing:border-box;padding:10px;border:1px solid #cbd2d9;border-radius:5px;font-size:15px}.btn{width:100%;border:0;border-radius:20px;padding:11px;background:#1a5fb4;color:#fff;font-weight:bold;cursor:pointer}.errorlist{color:#b42318;font-size:13px;padding-left:18px}</style>
</head><body><main class="card"><h1>ExamHub</h1><p>Sign in to access your teacher or pupil workspace.</p><form method="post">{% csrf_token %}{{ form.non_field_errors }}<div class="field"><label for="id_username">Username</label>{{ form.username }}</div><div class="field"><label for="id_password">Password</label>{{ form.password }}</div><button class="btn" type="submit">Sign in</button></form></main></body></html>
