{% comment %}
"Show / hide password" eye button on every password box on the page, including ones added
later (dialogs). Include once, just before </body>. Self-contained: no other scripts needed.
{% endcomment %}
<style>
  .pw-wrap{position:relative;display:block;width:100%;}
  .pw-wrap > input{width:100%;padding-right:42px !important;box-sizing:border-box;}
  .pw-eye{position:absolute;top:50%;right:6px;transform:translateY(-50%);width:32px;height:32px;display:flex;align-items:center;justify-content:center;
    border:none;background:none;border-radius:8px;color:#6b7280;cursor:pointer;padding:0;}
  .pw-eye:hover{color:#28186f;background:rgba(75,145,197,.10);}
  .pw-eye:focus-visible{outline:3px solid rgba(75,145,197,.5);outline-offset:1px;}
  .pw-eye svg{width:19px;height:19px;}
</style>
<script>
(function(){
  var EYE = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>';
  var EYE_OFF = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M17.9 17.9A10.4 10.4 0 0 1 12 19c-6.4 0-10-7-10-7a18.5 18.5 0 0 1 5.1-5.9M9.9 5.2A9.3 9.3 0 0 1 12 5c6.4 0 10 7 10 7a18.6 18.6 0 0 1-2.2 3.2M14.1 14.1a3 3 0 1 1-4.2-4.2"/><path d="M2 2l20 20"/></svg>';
  function setState(input, btn, show){
    input.type = show ? 'text' : 'password';
    btn.innerHTML = show ? EYE_OFF : EYE;
    btn.setAttribute('aria-label', show ? 'Hide password' : 'Show password');
    btn.title = show ? 'Hide password' : 'Show password';
    btn.setAttribute('aria-pressed', show ? 'true' : 'false');
  }
  function enhance(input){
    if(input.dataset.pwToggle) return;
    input.dataset.pwToggle = '1';
    var wrap = document.createElement('span');
    wrap.className = 'pw-wrap';
    input.parentNode.insertBefore(wrap, input);
    wrap.appendChild(input);
    var btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'pw-eye';
    wrap.appendChild(btn);
    setState(input, btn, false);
    btn.addEventListener('mousedown', function(e){ e.preventDefault(); });  // keep focus in the box
    btn.addEventListener('click', function(){ setState(input, btn, input.type === 'password'); input.focus(); });
    // Never submit or leave a password showing: hide it again when its form is sent.
    if(input.form) input.form.addEventListener('submit', function(){ setState(input, btn, false); });
  }
  function scan(root){
    (root.querySelectorAll ? root : document).querySelectorAll('input[type="password"]').forEach(enhance);
  }
  scan(document);
  new MutationObserver(function(muts){
    muts.forEach(function(m){ m.addedNodes.forEach(function(n){
      if(n.nodeType !== 1) return;
      if(n.matches && n.matches('input[type="password"]')) enhance(n); else scan(n);
    }); });
  }).observe(document.body, {childList: true, subtree: true});
  // A dialog that clears its fields on close should also go back to hidden.
  document.addEventListener('reset', function(e){
    e.target.querySelectorAll('input[data-pw-toggle]').forEach(function(i){
      var b = i.parentNode.querySelector('.pw-eye'); if(b) setState(i, b, false);
    });
  }, true);
})();
</script>
